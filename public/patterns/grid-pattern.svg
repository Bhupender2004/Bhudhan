<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(34, 197, 94, 0.2)" stroke-width="0.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1" fill="rgba(34, 197, 94, 0.3)"/>
    </pattern>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(34, 197, 94, 0.1)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.1)"/>
    </linearGradient>
  </defs>
  <rect width="60" height="60" fill="url(#gradient)"/>
  <rect width="60" height="60" fill="url(#grid)"/>
  <rect width="60" height="60" fill="url(#dots)"/>
</svg>
